<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>smf-animation-study</title>
  </head>
  <body>
    <canvas id="view" aria-label="MIDI note animation"></canvas>
    <section class="p-player" aria-label="MIDI player">
      <div class="p-player__button-list">
        <button
          class="p-player__button p-player__button--resume"
          id="resume"
          type="button"
          aria-pressed="false"
          aria-describedby="player-status"
          disabled
        >Play</button>
      </div>
      <p class="p-player__status" id="player-status" role="status" aria-live="polite">Loading audio…</p>
      <div class="p-player__time" aria-label="Playback time">
        <span class="p-player__current-time" data-role="current-time">0.00</span>
        <span aria-hidden="true"> / </span>
        <span class="p-player__duration" data-role="duration">—</span>
      </div>
      <a
        class="p-player__source"
        href="https://github.com/novogrammer/smf-animation-study"
        target="_blank"
        rel="noopener noreferrer"
      >View source on GitHub</a>
    </section>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
